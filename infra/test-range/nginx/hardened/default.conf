# HARDENED profile — the remediated posture. Re-serving the SAME hostnames with
# this profile is the closed-loop fix; a re-run measures each dimension as Fixed.

# --- app.range.test :80 -> permanent upgrade to HTTPS -------------------------
# periscan.http_redirect_enforcement -> Fixed (http_redirect_enforced).
server {
    listen 80;
    server_name app.range.test;
    return 301 https://$host$request_uri;
}

# --- app.range.test :443 -> full security headers, restrictive CORS, safe cookie
server {
    listen 443 ssl;
    server_name app.range.test;

    ssl_certificate     /etc/nginx/certs/app.crt;
    ssl_certificate_key /etc/nginx/certs/app.key;
    # TLS 1.2+ only -> periscan.tls_protocol_audit -> Fixed / Inconclusive.
    ssl_protocols TLSv1.2 TLSv1.3;

    # All four required security headers ->
    # periscan.http_health_check -> Fixed (http_healthy).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # No wildcard/reflected CORS -> periscan.http_cors_audit -> Fixed.
    # (No Access-Control-Allow-Origin header at all.)

    # Fully attributed cookie -> periscan.http_cookie_security -> Fixed.
    add_header Set-Cookie "session=abc; Path=/; Secure; HttpOnly; SameSite=Lax" always;

    # Published disclosure channel -> well_known_security_txt -> Detected.
    location = /.well-known/security.txt {
        alias /usr/share/nginx/security.txt;
        default_type text/plain;
    }
    location / { return 200 "hardened app\n"; }
}

# --- cert.range.test :443 -> valid CA-signed certificate ----------------------
# periscan.tls_certificate_check -> Fixed (tls_certificate_healthy).
server {
    listen 443 ssl;
    server_name cert.range.test;

    ssl_certificate     /etc/nginx/certs/cert-valid.crt;
    ssl_certificate_key /etc/nginx/certs/cert-valid.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / { return 200 "valid-cert host\n"; }
}
