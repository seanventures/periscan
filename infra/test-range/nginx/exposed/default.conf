# EXPOSED profile — deliberately weak posture. Each block maps to the Periscan
# module it should drive to validationState=Validated. See docs/MEASURED_TEST_RANGE.md.

# --- app.range.test :80 -> serves cleartext without upgrading to HTTPS ---------
# Drives periscan.http_redirect_enforcement -> Validated (http_no_https_redirect).
server {
    listen 80;
    server_name app.range.test;
    location / { return 200 "cleartext, no https redirect\n"; }
}

# --- app.range.test :443 -> missing headers, reflected CORS, insecure cookie ---
# Cert is the CA-signed leaf so undici/fetch trusts it (HTTP modules can run);
# the *exposure* is in the headers/cookies/CORS/protocol, not the cert.
server {
    listen 443 ssl;
    server_name app.range.test;

    ssl_certificate     /etc/nginx/certs/app.crt;
    ssl_certificate_key /etc/nginx/certs/app.key;
    # Offer deprecated protocols so periscan.tls_protocol_audit can negotiate them
    # (best-effort; depends on the platform OpenSSL — see MEASURED_TEST_RANGE.md §7).
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers DEFAULT@SECLEVEL=0;

    # Reflect the request Origin AND allow credentials -> a real working exploit:
    # any origin can make a credentialed cross-origin request and read the
    # authenticated response -> periscan.http_cors_audit -> Exploitable
    # (http_cors_credentialed_exploit). Non-destructively confirmed by the probe.
    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Access-Control-Allow-Credentials "true" always;

    # A cookie with no Secure / HttpOnly / SameSite ->
    # periscan.http_cookie_security -> Validated (http_insecure_cookies).
    add_header Set-Cookie "session=abc; Path=/" always;

    # NOTE: intentionally NO HSTS / CSP / X-Content-Type-Options / X-Frame-Options
    # -> periscan.http_health_check -> Validated (http_missing_security_headers).

    # No security.txt published (informational; well_known_security_txt -> absent).
    location = /.well-known/security.txt { return 404; }
    location / { return 200 "exposed app\n"; }
}

# --- cert.range.test :443 -> EXPIRED self-signed certificate -------------------
# Drives periscan.tls_certificate_check -> Validated (tls_certificate_expired).
# HTTP modules against this host are Inconclusive by design (fetch rejects it).
server {
    listen 443 ssl;
    server_name cert.range.test;

    ssl_certificate     /etc/nginx/certs/cert-expired.crt;
    ssl_certificate_key /etc/nginx/certs/cert-expired.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / { return 200 "expired-cert host\n"; }
}
