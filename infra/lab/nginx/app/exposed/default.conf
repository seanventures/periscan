# Tier-1 app — hop 1 (mirrors test-range exposed posture)
server {
    listen 80;
    server_name app.lab.range.test;
    location /health { return 200 "app-ok\n"; }
    location / { return 200 "app cleartext (exposed)\n"; }
}
server {
    listen 443 ssl;
    server_name app.lab.range.test;
    ssl_certificate     /etc/nginx/certs/lab.crt;
    ssl_certificate_key /etc/nginx/certs/lab.key;
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers DEFAULT@SECLEVEL=0;
    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Set-Cookie "session=lab; Path=/" always;
    location = /.well-known/security.txt { return 404; }
    location /health { return 200 "app-ok\n"; }
    location / { return 200 "app exposed\n"; }
}
