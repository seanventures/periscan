server {
    listen 8080;
    server_name data.lab.range.test;
    location /health { return 200 "data-ok\n"; }
    # Require Authorization header
    location /api/records {
        if ($http_authorization = "") {
            return 401 '{"error":"unauthorized"}\n';
        }
        default_type application/json;
        return 200 '{"records":[],"auth":"required"}\n';
    }
    location / { return 200 "data hardened\n"; }
}
