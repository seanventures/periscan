# Tier-2 data — hop 2 (plant-only network); open sensitive list (exposed)
server {
    listen 8080;
    server_name data.lab.range.test;
    location /health { return 200 "data-ok\n"; }
    # "sensitive" open endpoint — should measure as exposure / reachability
    location /api/records {
        default_type application/json;
        return 200 '{"records":["lab-secret-marker"],"auth":"none"}\n';
    }
    location / { return 200 "data exposed\n"; }
}
