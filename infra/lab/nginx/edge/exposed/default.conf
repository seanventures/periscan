# Tier-0 edge — weak external entry (hop 0)
server {
    listen 80;
    server_name edge.lab.range.test;
    location /health { return 200 "edge-ok\n"; }
    location / { return 200 "edge cleartext (exposed)\n"; }
}
server {
    listen 443 ssl;
    server_name edge.lab.range.test;
    ssl_certificate     /etc/nginx/certs/lab.crt;
    ssl_certificate_key /etc/nginx/certs/lab.key;
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers DEFAULT@SECLEVEL=0;
    # missing security headers
    location /health { return 200 "edge-ok\n"; }
    location / { return 200 "edge exposed\n"; }
}
