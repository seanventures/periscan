# Scan-executor overlay — builds + runs the SaaS worker image that carries the
# server-side OSS toolkit (gitleaks, nuclei, trivy, osv-scanner, prowler,
# promptfoo, pyrit, ffuf). Compose it alongside the datastore services:
#
#   docker compose \
#     -f infra/docker-compose/docker-compose.yml \
#     -f infra/docker-compose/docker-compose.scan-executor.yml up -d
#
# Default build target is `runtime` (no GPL redistribution). For a controlled
# Engine Lab / legal-review image that intentionally includes testssl/sqlmap/
# nikto/whatweb/ScoutSuite, use the optional profile:
#
#   docker compose \
#     -f infra/docker-compose/docker-compose.yml \
#     -f infra/docker-compose/docker-compose.scan-executor.yml \
#     --profile legal-review-tools up -d --build
#
# That profile is lab-only; do not ship it as production SaaS `latest`/`v*`.
# See docs/DEPLOY.md "Legal-review tools (Engine Lab opt-in)".
#
# In-network (AgentLocal) tools are NOT here — they ship in the runner-agent image.
services:
  scan-executor:
    build:
      context: ../..
      dockerfile: infra/docker/scan-executor.Dockerfile
      # Default final stage: permissive toolkit only.
      target: runtime
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://periscan:periscan@postgres:5432/periscan
      PERISCAN_REDIS_URL: redis://redis:6379
      PERISCAN_EVIDENCE_S3_ENDPOINT: http://minio:9000
      PERISCAN_EVIDENCE_S3_BUCKET: periscan-evidence
      PERISCAN_EVIDENCE_S3_ACCESS_KEY_ID: periscan
      PERISCAN_EVIDENCE_S3_SECRET_ACCESS_KEY: periscan123
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # Optional lab service — same worker, but built from runtime-legal-review so
  # GPL RequiresLegalReview tools are present. Profile keeps it out of default up.
  scan-executor-legal-review:
    profiles: ["legal-review-tools"]
    build:
      context: ../..
      dockerfile: infra/docker/scan-executor.Dockerfile
      target: runtime-legal-review
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://periscan:periscan@postgres:5432/periscan
      PERISCAN_REDIS_URL: redis://redis:6379
      PERISCAN_EVIDENCE_S3_ENDPOINT: http://minio:9000
      PERISCAN_EVIDENCE_S3_BUCKET: periscan-evidence
      PERISCAN_EVIDENCE_S3_ACCESS_KEY_ID: periscan
      PERISCAN_EVIDENCE_S3_SECRET_ACCESS_KEY: periscan123
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
