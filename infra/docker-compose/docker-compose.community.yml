# Community local overlay — api + web + worker against periscan-deps.
#
# Strangers / GitHub clone: do NOT `docker compose up` at the repo root.
# This overlay is the local Community path.
#
#   docker compose \
#     -f infra/docker-compose/docker-compose.community-deps.yml \
#     -f infra/docker-compose/docker-compose.community.yml \
#     up -d --build --wait
#
# Or: bash scripts/community-up.sh
#
# Worker is scan-executor `runtime` (Gitleaks/Nuclei/Trivy/OSV, no GPL).
# Faster host-toolchain path (no image build): `pnpm lab:dev` after
#   docker compose -f infra/docker-compose/docker-compose.community-deps.yml up -d --wait
#
# PERISCAN_DEV_MODE=true is local-only. Production forbids it:
# PERISCAN_DEPLOYMENT_ENVIRONMENT=production fails closed when the flag is true.
#
# Publishes API :3001 and web :3000 on the host. In-network DATABASE_URL uses
# postgres:5432 (not the host-published port).

x-community-app-env: &community-app-env
  NODE_ENV: production
  PERISCAN_DEPLOYMENT_ENVIRONMENT: development
  PERISCAN_DEV_MODE: "true"
  PERISCAN_RUNNER_REQUIRE_MTLS: "false"
  PERISCAN_COOKIE_SECURE: "false"
  PERISCAN_EMAIL_TRANSPORT: console
  PERISCAN_EMAIL_FROM: Periscan <no-reply@periscan.local>
  PERISCAN_WEB_BASE_URL: http://127.0.0.1:3000
  PERISCAN_CORS_ORIGINS: http://127.0.0.1:3000,http://localhost:3000
  PERISCAN_JWT_SECRET: periscan-dev-session-secret
  PERISCAN_DATA_REGION: us-east-1
  DATABASE_URL: postgresql://periscan:periscan@postgres:5432/periscan
  REDIS_URL: redis://redis:6379
  PERISCAN_EVIDENCE_S3_ENDPOINT: http://minio:9000
  PERISCAN_EVIDENCE_S3_BUCKET: periscan-evidence
  PERISCAN_EVIDENCE_S3_ACCESS_KEY_ID: periscan
  PERISCAN_EVIDENCE_S3_SECRET_ACCESS_KEY: periscan123
  PERISCAN_EVIDENCE_S3_REGION: us-east-1
  PERISCAN_EVIDENCE_S3_FORCE_PATH_STYLE: "true"

services:
  migrate:
    image: periscan-api:community-local
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: "no"
    environment:
      DATABASE_URL: postgresql://periscan:periscan@postgres:5432/periscan
    command: ["pnpm", "--filter", "@periscan/db", "db:migrate:deploy"]
    depends_on:
      postgres:
        condition: service_healthy

  s3-init:
    image: periscan-api:community-local
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: "no"
    environment:
      <<: *community-app-env
    command: ["pnpm", "--filter", "@periscan/evidence", "exec", "tsx", "src/ensure-local-bucket.ts"]
    depends_on:
      minio:
        condition: service_healthy

  api:
    image: periscan-api:community-local
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      <<: *community-app-env
      PERISCAN_API_HOST: "0.0.0.0"
      PERISCAN_API_PORT: "3001"
    ports:
      - "${PERISCAN_API_PUBLISHED_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - "CMD-SHELL"
        - 'node -e "fetch(''http://127.0.0.1:3001/api/v1/health'').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  worker:
    # Scan-executor runtime = worker + Gitleaks/Nuclei/Trivy/OSV (no GPL stage).
    image: periscan-scan-executor:community-local
    build:
      context: ../..
      dockerfile: infra/docker/scan-executor.Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      <<: *community-app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

  web:
    image: periscan-web:community-local
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PERISCAN_DEPLOYMENT_ENVIRONMENT: development
      PERISCAN_WEB_PORT: "3000"
      PERISCAN_API_URL: http://api:3001
      PERISCAN_WEB_BASE_URL: http://127.0.0.1:3000
    ports:
      - "${PERISCAN_WEB_PUBLISHED_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD-SHELL"
        - 'node -e "fetch(''http://127.0.0.1:3000/api/v1/health'').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
