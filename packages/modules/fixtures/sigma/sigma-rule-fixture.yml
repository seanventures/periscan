title: Suspicious PowerShell Encoded Command
id: 7f0f8a5d-82a3-4ac4-9d5a-periscanfixture
status: stable
description: Detects fixture-only encoded PowerShell command execution for Periscan control coverage import tests.
author: Periscan
date: 2026-06-20
references:
  - https://attack.mitre.org/techniques/T1059/001/
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: '\powershell.exe'
    CommandLine|contains: "-enc"
  condition: selection
falsepositives:
  - Administrative scripts in approved change windows
level: high
