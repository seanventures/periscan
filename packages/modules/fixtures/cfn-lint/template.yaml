AWSTemplateFormatVersion: "2010-09-09"
Description: Periscan cfn-lint fixture. Synthetic CloudFormation. Not a live account.
Resources:
  FixtureBucket:
    Type: AWS::S3::Bucket
    Properties:
      AccessControl: PublicRead
  FixtureRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: FixtureWildcard
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: "*"
                Resource: "*"
