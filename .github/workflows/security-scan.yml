name: Security Scan

# WS3 platform-security guardrails: static analysis (CodeQL) on push/PR to main,
# and a dependency-review gate on PRs. These complement the fatal high+ `pnpm
# audit` already run in `verify`. Advisory alerts surface in the Security tab;
# dependency-review blocks a PR that introduces a high-severity vulnerable dep.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly full scan so advisories on unchanged code still get caught.
    - cron: "0 7 * * 1"

# Least-privilege: only what each job needs.
permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL (JS/TS)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # 'security-and-quality' is the broadest built-in query pack.
          queries: security-and-quality

      - name: Analyze
        uses: github/codeql-action/analyze@v4

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    # Dependency review only runs on PRs (it diffs the manifest against the base).
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Review dependencies
        uses: actions/dependency-review-action@v4
        with:
          # Match the fatal threshold already enforced by `pnpm audit --audit-level high`.
          fail-on-severity: high
