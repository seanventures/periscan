name: Feature
description: Propose Community, BAS/AEV, or validation behavior.
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Community edition is the open-core entry point; full BAS/AEV development is in scope.
        First useful PR is an [engine adapter](https://github.com/seanventures/periscan/issues/new?template=engine-adapter.yml) — use that form if you are wrapping a tool.

        Read [COMMUNITY.md](https://github.com/seanventures/periscan/blob/main/COMMUNITY.md), [OPEN_CORE.md](https://github.com/seanventures/periscan/blob/main/OPEN_CORE.md), [GOVERNANCE.md](https://github.com/seanventures/periscan/blob/main/GOVERNANCE.md), and [docs/SETTLED.md](https://github.com/seanventures/periscan/blob/main/docs/SETTLED.md).
  - type: dropdown
    id: offering
    attributes:
      label: Offering
      options:
        - Community edition (validation pack / proof loop)
        - Engine adapter (use the Engine adapter template instead if that is the whole request)
        - Docs / first-hour
        - Commercial edge (MSSP, hosted, SSO polish) — may be declined as out of Community
        - Unsure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who is stuck, on what authorized scope, without this?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Behavior, API, or UX. Honest AEV/CTEM language only.
    validations:
      required: true
  - type: textarea
    id: non-goals
    attributes:
      label: Explicit non-goals
      description: Describe scope limits, side effects, cleanup and unsupported claims.
    validations:
      required: true
  - type: checkboxes
    id: settled
    attributes:
      label: SETTLED (must all hold)
      options:
        - label: This is not a request to rewrite root LICENSE or announce that Periscan is open source.
          required: true
        - label: The proposal includes per-scenario policy and runtime qualification.
          required: true
        - label: This does not mark Fixed without a verification event.
          required: true
        - label: This does not put AGPL / SSPL / BSL / Commons Clause / PolyForm on the default image or Community start.
          required: true
        - label: Shipped capability claims are backed by measured evidence.
          required: true
        - label: Denied tasks still never queue; product-visible data stays real or honest-empty.
          required: true
