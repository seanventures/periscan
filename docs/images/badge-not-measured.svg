  <!--
    Honest Community measurement mark — not a shields.io clone.
    Same dark plate as badge-measured.svg; rings idle (dim, no inner sweep).
    Use this when no completed Community run with evidence exists
    (never started, in flight, finished empty, or policy denied).
    Dashes are omitted on purpose: a spinner would look like a run in progress.
    Never relabel Secure / Certified / Pentested / Fixed.
    Never recolor to Fixed-green (#2fe0b0). Static asset only.
  -->
  <title id="badge-not-measured-title">Not measured by Periscan</title>
